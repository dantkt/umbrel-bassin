version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: dany-bassin_web_1
      APP_PORT: 8080
  web:
    build: .
    restart: on-failure
    stop_grace_period: 1m
    ports:
      - "3337:3333"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      BTC_HOST: $APP_BITCOIN_NODE_IP
      BTC_PORT: $APP_BITCOIN_RPC_PORT
      BTC_USER: $APP_BITCOIN_RPC_USER
      BTC_PASS: $APP_BITCOIN_RPC_PASS
      CKPOOL_LOGS: /data/logs
      STATE_FILE: /data/state.json
