# Installation directe sur ton Umbrel, sans GitHub ni App Store.
# Lancer : BTC_PASS=ton_mot_de_passe_rpc docker compose -f docker-compose.local.yml up -d --build
services:
  bassin:
    build: .
    restart: unless-stopped
    ports:
      - "8088:8080"   # dashboard
      - "3337:3333"   # stratum pour tes mineurs
    volumes:
      - ./data:/data
    environment:
      BTC_HOST: ${BTC_HOST:-10.21.21.8}
      BTC_PORT: ${BTC_PORT:-8332}
      BTC_USER: ${BTC_USER:-umbrel}
      BTC_PASS: ${BTC_PASS}
      CKPOOL_LOGS: /data/logs
      STATE_FILE: /data/state.json
    networks: [umbrel_main_network]
networks:
  umbrel_main_network:
    external: true
